on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - run: |
          curl -LO https://github.com/MCRcortex/voxy/archive/refs/heads/dev.tar.gz
          tar -xf dev.tar.gz

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - working-directory: voxy-dev
        run: |
          ./gradlew build -PincludeOtherArchs=true

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create voxy ./voxy-dev/build/libs/*.jar --draft --repo $GITHUB_REPOSITORY
